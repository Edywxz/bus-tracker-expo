name: CI

# Roda em todo PR para main e em todo push de branch. Para impedir que algo chegue ao main sem passar,
# ative em GitHub → Settings → Branches → Branch protection rule (main): "Require status checks to pass"
# marcando app, edge-functions e database.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle Android (garante que o app compila)
        run: npx expo export --platform android

  edge-functions:
    name: edge-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Sobe o Supabase local (aplica todas as migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api
      - name: Testes SQL
        run: |
          for f in supabase/tests/*.sql; do
            echo "== $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done

  # Só roda se app, edge-functions e database passaram. Se qualquer um falhar, o PR fica aberto.
  automerge:
    name: automerge
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: [app, edge-functions, database]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # para disparar o deploy do site (merge feito pelo GITHUB_TOKEN não aciona o push do site.yml)
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Espera o Gemini revisar este commit. Com comentários, não mescla: o workflow gemini-fix corrige e o push dispara
      # um novo CI. Se o gemini-fix recusar tudo (não há commit), ele comenta "Revisão do Gemini: nenhuma alteração feita"
      # e reexecuta este job, que então mescla. Sem revisão em 10 min (app fora do ar, PR de bot), mescla mesmo assim.
      - name: Espera a revisão do Gemini
        id: gemini
        run: |
          echo "merge=true" >> "$GITHUB_OUTPUT"
          for i in $(seq 20); do
            r=$(gh api "repos/$REPO/pulls/$PR/reviews" --jq "[.[] | select(.user.login==\"gemini-code-assist[bot]\" and .commit_id==\"$SHA\")] | last // empty | \"\(.id) \(.submitted_at)\"")
            if [ -n "$r" ]; then
              set -- $r; id=$1; em=$2
              n=$(gh api "repos/$REPO/pulls/$PR/reviews/$id/comments" --jq length)
              if [ "$n" -gt 0 ]; then
                recusou=$(gh api "repos/$REPO/issues/$PR/comments" --jq "[.[] | select(.user.login==\"claude[bot]\" and .created_at > \"$em\" and (.body | startswith(\"Revisão do Gemini: nenhuma alteração feita\")))] | length")
                if [ "$recusou" -gt 0 ]; then
                  echo "Gemini deixou $n comentário(s), todos recusados pelo gemini-fix: mescla."
                else
                  echo "Gemini deixou $n comentário(s): não mescla, aguarda a correção."
                  echo "merge=false" >> "$GITHUB_OUTPUT"
                fi
              fi
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Gemini não revisou em 10 min; mesclando sem a revisão."
      - name: Squash merge e apaga a branch
        if: steps.gemini.outputs.merge == 'true'
        run: gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
      - name: Publica o site se o PR mexeu nele
        if: steps.gemini.outputs.merge == 'true'
        run: |
          if gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path' | grep -qE '^(site/|\.github/workflows/site\.yml$)'; then
            gh workflow run site.yml --repo "$REPO" --ref main
          fi
