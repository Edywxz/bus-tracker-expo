name: CI

# Roda em todo PR para main e em todo push de branch. Para impedir que algo chegue ao main sem passar,
# ative em GitHub → Settings → Branches → Branch protection rule (main): "Require status checks to pass"
# marcando app, edge-functions e database.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle Android (garante que o app compila)
        run: npx expo export --platform android

  edge-functions:
    name: edge-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check supabase/functions/*/index.ts

  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Sobe o Supabase local (aplica todas as migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api
      - name: Testes SQL
        run: |
          for f in supabase/tests/*.sql; do
            echo "== $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done
