name: CI

# Roda em todo PR para main e em todo push de branch. Para impedir que algo chegue ao main sem passar,
# ative em GitHub → Settings → Branches → Branch protection rule (main): "Require status checks to pass"
# marcando app, edge-functions e database.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle Android (garante que o app compila)
        run: npx expo export --platform android

  edge-functions:
    name: edge-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Sobe o Supabase local (aplica todas as migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api
      - name: Testes SQL
        run: |
          for f in supabase/tests/*.sql; do
            echo "== $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done

  # Só roda se app, edge-functions e database passaram. Se qualquer um falhar, o PR fica aberto.
  automerge:
    name: automerge
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: [app, edge-functions, database]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # para disparar o deploy do site (merge feito pelo GITHUB_TOKEN não aciona o push do site.yml)
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Mescla assim que o Claude responder à última revisão do Gemini (corrigiu com commit ou recusou tudo), sem esperar
      # uma segunda revisão. Etapas, a cada 30 s por até 10 min:
      #  - Gemini avisou que não revisa os arquivos do PR: mescla;
      #  - sem revisão do Gemini ainda: espera (no fim, mescla mesmo assim: app fora do ar, PR de bot);
      #  - revisão sem comentários: mescla;
      #  - com comentários e o comentário "Revisão do Gemini: ..." do Claude depois dela (correção ou recusa): mescla;
      #  - com comentários, revisão deste commit e sem resposta do Claude: não mescla; o gemini-fix responde e
      #    reexecuta este job (recusa) ou faz push (correção) e o novo CI cuida do merge;
      #  - com comentários, revisão de commit anterior (Claude acabou de corrigir) e sem resposta: espera o comentário.
      - name: Espera a revisão do Gemini e a resposta do Claude
        id: gemini
        run: |
          echo "merge=true" >> "$GITHUB_OUTPUT"
          for i in $(seq 20); do
            # O Gemini não revisa certos tipos de arquivo (ex.: só workflows) e avisa num comentário: não há o que esperar.
            nao=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --jq '[.[] | select(.user.login=="gemini-code-assist[bot]" and (.body | test("unable to generate a review")))] | length')
            if [ "${nao:-0}" -gt 0 ]; then echo "Gemini não revisa este tipo de arquivo: mescla."; exit 0; fi
            r=$(gh api "repos/$REPO/pulls/$PR/reviews" --jq '[.[] | select(.user.login=="gemini-code-assist[bot]")] | last // empty | "\(.id) \(.submitted_at) \(.commit_id)"')
            if [ -n "$r" ]; then
              set -- $r; id=$1; em=$2; commit=$3
              n=$(gh api "repos/$REPO/pulls/$PR/reviews/$id/comments" --jq length)
              if [ "$n" -eq 0 ]; then echo "Revisão do Gemini sem comentários: mescla."; exit 0; fi
              resp=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --jq "[.[] | select(.user.login==\"claude[bot]\" and .created_at > \"$em\" and (.body | startswith(\"Revisão do Gemini:\")))] | length")
              if [ "${resp:-0}" -gt 0 ]; then echo "Claude respondeu aos $n comentário(s) do Gemini: mescla."; exit 0; fi
              if [ "$commit" = "$SHA" ]; then
                echo "Gemini deixou $n comentário(s) neste commit: não mescla, aguarda o gemini-fix."
                echo "merge=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::warning::Sem revisão do Gemini ou resposta do Claude em 10 min; mesclando assim mesmo."
      - name: Squash merge e apaga a branch
        if: steps.gemini.outputs.merge == 'true'
        run: gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
      - name: Publica o site se o PR mexeu nele
        if: steps.gemini.outputs.merge == 'true'
        run: |
          if gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path' | grep -qE '^(site/|\.github/workflows/site\.yml$)'; then
            gh workflow run site.yml --repo "$REPO" --ref main
          fi
